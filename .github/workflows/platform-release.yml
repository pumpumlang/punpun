name: platform-release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read release version
        run: echo "PUNPUN_VERSION=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_ENV"
      - name: Install runtime/release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev python3-pil zstd
      - name: Regenerate and verify canonical PP brand
        run: |
          python3 scripts/build_brand.py --repo-root .
          git diff --exit-code -- assets editors/vscode/icon.png editors/vscode/assets editors/vscode/fileicons
      - name: Build and test
        run: make -j2 test
      - name: Validate documentation links
        run: python3 scripts/check_links.py README.md docs docs-site/content examples editors/vscode/README.md CONTRIBUTING.md SECURITY.md
      - name: Probe installed compiler/linker capabilities
        run: python3 scripts/probe_toolchains.py gcc clang --output toolchain-probes/linux.json
      - name: Large-project smoke benchmark
        run: python3 scripts/benchmark_projects.py --modules 10 100 --rounds 2 --gate --output benchmarks/linux.json
      - name: Assemble and validate Linux release
        run: python3 scripts/release.py
      - uses: actions/upload-artifact@v7
        with:
          name: punpun-linux-release
          path: |
            dist/release-${{ env.PUNPUN_VERSION }}/
            benchmarks/linux.json
            toolchain-probes/linux.json

  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Refresh keys and install build tools
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm --needed base-devel gcc python python-pillow nodejs zstd curl git sudo
      - uses: actions/checkout@v7
      - name: Read release version
        run: echo "PUNPUN_VERSION=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_ENV"
      - name: Regenerate and verify canonical PP brand
        run: |
          python3 scripts/build_brand.py --repo-root .
          git diff --exit-code -- assets editors/vscode/icon.png editors/vscode/assets editors/vscode/fileicons
      - name: Build release inputs
        run: python3 scripts/release.py --skip-tests
      - name: Build canonical makepkg artifact
        run: |
          cp "dist/release-$PUNPUN_VERSION/PunPun-$PUNPUN_VERSION-linux-x86_64.tar.zst" packaging/arch/
          useradd -m builder
          chown -R builder:builder .
          sudo -u builder bash -lc "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg --noconfirm --cleanbuild --force"
      - name: Install, compile, upgrade, and uninstall
        run: |
          pacman -U --noconfirm packaging/arch/punpun-*.pkg.tar.zst
          ppc --version
          tmp=$(mktemp -d)
          printf 'launch { say("arch-ok"); }\n' > "$tmp/main.pp"
          (cd "$tmp" && pp build main.pp -o smoke && ./smoke | grep -Fx arch-ok)
          pacman -U --noconfirm packaging/arch/punpun-*.pkg.tar.zst
          pacman -R --noconfirm punpun
          hash -r
          ! command -v ppc
      - uses: actions/upload-artifact@v7
        with:
          name: punpun-arch-package
          path: packaging/arch/punpun-*.pkg.tar.zst

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read release version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          "PUNPUN_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            make
            python
          pacboy: >-
            gcc:p
      - name: Build Windows compiler and runtime
        shell: msys2 {0}
        run: |
          make -B compiler CXX=g++ CC=gcc
          ./build/ppc.exe --version
          printf 'launch { say("windows-ok"); }\n' > windows-smoke.pp
          ./build/ppc.exe build windows-smoke.pp -o windows-smoke.exe --cc-backend
          ./windows-smoke.exe | grep -Fx windows-ok
      - name: Stage Windows SDK payload
        shell: pwsh
        run: |
          $payload = "installers/windows/payload"
          Remove-Item $payload -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$payload/bin" | Out-Null
          Copy-Item build/ppc.exe "$payload/bin/ppc.exe"
          Copy-Item runtime,stdlib,packages,ppx,tooling,editors,docs,spec,assets,gui-maker,selfhost -Destination $payload -Recurse
          Copy-Item VERSION,README.md,LICENSE,CHANGELOG.md,ROADMAP.md,PROJECT_STATUS.txt,COMPLETION_REPORT.md,PUBLISHING.md,RELEASE_NOTES.md,SECURITY.md,CONTRIBUTING.md -Destination $payload
      - name: Install WiX and build installers
        shell: pwsh
        run: |
          dotnet tool install --global wix
          wix extension add WixToolset.Bal.wixext
          ./installers/windows/build.ps1
      - name: MSI install, file association, upgrade, and uninstall
        shell: pwsh
        run: |
          $msi = (Resolve-Path "installers/windows/PunPun-$env:PUNPUN_VERSION-win-x64.msi")
          Start-Process msiexec.exe -Wait -ArgumentList "/i `"$msi`" /qn /norestart"
          & "$env:ProgramFiles/PunPun/bin/ppc.exe" --version
          reg query HKLM\Software\Classes\.pp /ve
          Start-Process msiexec.exe -Wait -ArgumentList "/i `"$msi`" /qn /norestart REINSTALL=ALL REINSTALLMODE=vomus"
          Start-Process msiexec.exe -Wait -ArgumentList "/x `"$msi`" /qn /norestart"
          if (Test-Path "$env:ProgramFiles/PunPun/bin/ppc.exe") { throw "uninstall left compiler behind" }
      - uses: actions/upload-artifact@v7
        with:
          name: punpun-windows-installers
          path: |
            installers/windows/PunPun-${{ env.PUNPUN_VERSION }}-win-x64.msi
            installers/windows/PunPun-Setup-${{ env.PUNPUN_VERSION }}.exe
