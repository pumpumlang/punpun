name: punbrain

on:
  pull_request:
    paths:
      - 'examples/punbrain/**'
      - '.github/workflows/punbrain.yml'
  push:
    branches:
      - 'feature/punbrain'
    paths:
      - 'examples/punbrain/**'
      - '.github/workflows/punbrain.yml'

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build PunPun compiler
        run: make -j2 compiler

      - name: Check and build PunBrain
        run: |
          ./build/ppc check examples/punbrain/main.pp
          ./build/ppc build --backend=c -O2 -o /tmp/punbrain examples/punbrain/main.pp
          /tmp/punbrain version | grep -F 'PunBrain 0.3.0'
          /tmp/punbrain selftest

      - name: Deterministic F3+C parser check
        run: |
          /tmp/punbrain parse '/execute in minecraft:overworld run tp @s 100.300 64.000 -200.700 -45.000 0.000' | grep -F '"ok":true'

      - name: Ensure standalone architecture
        run: |
          ! grep -F '127.0.0.1:52533' examples/punbrain/main.pp
          grep -F 'PB_GUI_PORT 52534' examples/punbrain/main.pp
          test -f examples/punbrain/NOTICE.md
          test -f examples/punbrain/LICENSE

      - name: Package PunBrain
        run: |
          mkdir -p dist/PunBrain
          cp examples/punbrain/main.pp dist/PunBrain/
          cp examples/punbrain/README.md dist/PunBrain/
          cp examples/punbrain/NOTICE.md dist/PunBrain/
          cp examples/punbrain/LICENSE dist/PunBrain/
          cp examples/punbrain/SPEEDRUN_RULES.md dist/PunBrain/
          cp /tmp/punbrain dist/PunBrain/punbrain
          chmod +x dist/PunBrain/punbrain

      - uses: actions/upload-artifact@v4
        with:
          name: PunBrain_Standalone_Bundle
          path: dist/PunBrain
          if-no-files-found: error
