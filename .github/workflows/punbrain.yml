name: punbrain

on:
  pull_request:
    paths:
      - 'examples/punbrain/**'
      - '.github/workflows/punbrain.yml'
  push:
    branches:
      - 'feature/punbrain'
    paths:
      - 'examples/punbrain/**'
      - '.github/workflows/punbrain.yml'

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build PunPun compiler
        run: make -j2 compiler
      - name: Check and build PunBrain core
        run: |
          ./build/ppc check examples/punbrain/main.pp
          ./build/ppc build --backend=c -O2 -o /tmp/punbrain-core examples/punbrain/main.pp
          /tmp/punbrain-core version
      - name: Deterministic solver smoke test
        run: |
          python3 - <<'PY'
          import json, math, subprocess
          target=(1608.0,1608.0)
          starts=[(0.0,0.0),(200.0,0.0)]
          args=['/tmp/punbrain-core','solve']
          for x,z in starts:
              b=-math.degrees(math.atan2(target[0]-x,target[1]-z))
              args += [str(x),str(z),str(b),'0.04']
          out=json.loads(subprocess.check_output(args,text=True))
          assert out['ok'] is True, out
          assert abs(out['x']-target[0]) <= 16.0, out
          assert abs(out['z']-target[1]) <= 16.0, out
          assert out['confidence'] > 0.1, out
          blind=json.loads(subprocess.check_output(['/tmp/punbrain-core','blind','100','100'],text=True))
          assert blind['ok'] is True and blind['mode']=='blind', blind
          print(json.dumps(out, indent=2))
          PY

  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Fabric companion
        run: gradle -p examples/punbrain/fabric build --no-daemon
