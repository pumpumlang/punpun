name: punbrain-legal

on:
  pull_request:
    paths:
      - 'examples/punbrain/**'
      - '.github/workflows/punbrain.yml'
  push:
    branches:
      - 'feature/punbrain'
    paths:
      - 'examples/punbrain/**'
      - '.github/workflows/punbrain.yml'

permissions:
  contents: read

jobs:
  legal-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build PunPun compiler
        run: make -j2 compiler

      - name: Check and build legal relay
        run: |
          ./build/ppc check examples/punbrain/main.pp
          ./build/ppc build --backend=c -O2 -o /tmp/punbrain-legal examples/punbrain/main.pp
          /tmp/punbrain-legal legal-version | grep -F 'PunBrain Legal Relay 0.2.0'

      - name: Check external overlay syntax
        run: python3 -m py_compile examples/punbrain/legal-overlay.py

      - name: Enforce leaderboard-facing boundaries
        run: |
          test ! -d examples/punbrain/fabric
          ! grep -E 'EyeOfEnderEntity|MinecraftClient|fabric-api|fabricmc' examples/punbrain/main.pp examples/punbrain/legal-overlay.py
          grep -F 'http://127.0.0.1:52533/api/v1/' examples/punbrain/main.pp >/dev/null
          grep -F 'http://127.0.0.1:52533/api/v1' examples/punbrain/legal-overlay.py >/dev/null

      - name: Package PunBrain Legal Mode
        run: |
          mkdir -p dist/PunBrain_Legal
          cp examples/punbrain/main.pp dist/PunBrain_Legal/
          cp examples/punbrain/legal-overlay.py dist/PunBrain_Legal/
          cp examples/punbrain/README.md dist/PunBrain_Legal/
          cp examples/punbrain/LEGALITY.md dist/PunBrain_Legal/
          cp /tmp/punbrain-legal dist/PunBrain_Legal/punbrain-legal
          chmod +x dist/PunBrain_Legal/punbrain-legal

      - uses: actions/upload-artifact@v4
        with:
          name: PunBrain_Legal_Bundle
          path: dist/PunBrain_Legal
          if-no-files-found: error
